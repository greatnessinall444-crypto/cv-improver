 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Improver AI</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#2563eb">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
    <!-- Header -->
    <header class="bg-blue-600 text-white shadow-md p-4 sticky top-0 z-10">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                🚀 CV Improver AI
            </h1>
            <button id="installBtn" class="hidden bg-white text-blue-600 px-3 py-1.5 rounded-lg font-medium text-sm hover:bg-blue-50 transition">
                Install App
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-5xl mx-auto p-4 md:p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Input Section -->
        <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-semibold mb-4 text-slate-700">Paste Original CV</h2>
            <textarea id="originalCv" class="w-full h-80 p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none resize-none" placeholder="Paste your CV content here..."></textarea>
            <button onclick="improveCV()" class="w-full mt-4 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition shadow">
                Improve CV
            </button>
        </section>

        <!-- Output Section -->
        <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold text-slate-700">Improved CV</h2>
                <div class="flex gap-2">
                    <button onclick="copyCV()" class="px-3 py-1.5 text-sm bg-slate-100 hover:bg-slate-200 border border-slate-300 rounded-lg font-medium transition">
                        📋 Copy
                    </button>
                    <button onclick="downloadCV()" class="px-3 py-1.5 text-sm bg-slate-100 hover:bg-slate-200 border border-slate-300 rounded-lg font-medium transition">
                        💾 Download
                    </button>
                </div>
            </div>
            <textarea id="improvedCv" class="w-full h-80 p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none resize-none bg-slate-50" readonly placeholder="Your improved CV will appear here..."></textarea>
        </section>
    </main>

    <script>
        function improveCV() {
            const input = document.getElementById('originalCv').value;
            if (!input.trim()) return alert('Please enter your CV text first!');
            document.getElementById('improvedCv').value = "Processing your CV...\n\n(Connect your backend logic here to return improved text)";
        }

        function copyCV() {
            const output = document.getElementById('improvedCv');
            if (!output.value) return;
            navigator.clipboard.writeText(output.value);
            alert('Copied to clipboard!');
        }

        function downloadCV() {
            const text = document.getElementById('improvedCv').value;
            if (!text) return;
            const blob = new Blob([text], { type: 'text/plain' });
            const anchor = document.createElement('a');
            anchor.download = 'Improved_CV.txt';
            anchor.href = window.URL.createObjectURL(blob);
            anchor.click();
        }

        // PWA Install Prompt Handler
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installBtn').classList.remove('hidden');
        });

        document.getElementById('installBtn').addEventListener('click', () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(() => {
                    deferredPrompt = null;
                    document.getElementById('installBtn').classList.add('hidden');
                });
            }
        });
    </script>
</body>
</html>
