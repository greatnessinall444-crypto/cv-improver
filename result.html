<!DOCTYPE html>
<html>
<head>
    <title>Improved CV</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f6f8;
            text-align: center;
            padding: 50px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 60%;
            margin: auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        textarea {
            width: 90%;
            height: 250px;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: white;
            background: #28a745;
            padding: 10px 20px;
            border-radius: 5px;
        }

        a:hover {
            background: #1e7e34;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>✅ Improved CV</h1>

    <textarea>{{ improved_text }}</textarea><br>

    <a href="/">⬅ Back</a>
</div>

</body>
</html>
